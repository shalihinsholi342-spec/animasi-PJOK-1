<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Animasi PJOK</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061c3b;font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#061c3b}
.poster{
 position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
 transform-origin:center;animation:cameraMove 22s ease-in-out infinite alternate;
}
@keyframes cameraMove{
 0%{transform:scale(1.02) translate3d(0,0,0)}
 35%{transform:scale(1.12) translate3d(-1.2%,.5%,0)}
 70%{transform:scale(1.17) translate3d(1%,-.5%,0)}
 100%{transform:scale(1.07) translate3d(0,0,0)}
}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,#00142b55 100%)}
.logo-wrap{
 position:absolute;z-index:5;top:3.5%;left:50%;width:clamp(100px,13vw,190px);
 aspect-ratio:1;transform:translateX(-50%);display:grid;place-items:center;
 animation:logoCycle 12s infinite;
}
.logo-bg{
 position:absolute;inset:0;border-radius:50%;background:#ffffffed;
 box-shadow:0 0 18px #fff,0 0 42px #ffe66b,0 8px 25px #001c45aa;
}
.logo{
 position:relative;width:82%;height:82%;object-fit:contain;z-index:1;
 animation:logoFloat 3s ease-in-out infinite;
}
.logo-wrap:after{
 content:"";position:absolute;inset:-12%;border:3px solid #fff7a8;border-radius:50%;
 box-shadow:0 0 18px #fff4a5;animation:ring 4s linear infinite;
}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes ring{to{transform:rotate(360deg) scale(1.08)}}
@keyframes logoCycle{
 0%,8%{opacity:0;transform:translateX(-50%) scale(.2) rotate(-30deg)}
 15%,35%{opacity:1;transform:translateX(-50%) scale(1) rotate(0)}
 43%,53%{opacity:0;transform:translateX(-50%) scale(.4) rotate(35deg)}
 60%,82%{opacity:1;transform:translateX(-50%) scale(1) rotate(0)}
 90%,100%{opacity:0;transform:translateX(-50%) scale(1.8) rotate(15deg)}
}
.sparkles{position:absolute;inset:0;pointer-events:none;z-index:3}
.spark{
 position:absolute;color:#fff7a8;text-shadow:0 0 12px #fff;
 animation:twinkle 2.2s ease-in-out infinite alternate;
}
.spark:nth-child(1){left:8%;top:20%;font-size:28px}
.spark:nth-child(2){left:82%;top:24%;font-size:35px;animation-delay:.7s}
.spark:nth-child(3){left:16%;top:72%;font-size:22px;animation-delay:1.1s}
.spark:nth-child(4){left:90%;top:70%;font-size:30px;animation-delay:.4s}
@keyframes twinkle{from{opacity:.15;transform:scale(.5) rotate(0)}to{opacity:1;transform:scale(1.4) rotate(45deg)}}
.caption{
 position:absolute;z-index:4;left:50%;bottom:3%;transform:translateX(-50%);
 color:white;text-align:center;font-weight:800;letter-spacing:1.5px;
 font-size:clamp(11px,1.5vw,19px);text-shadow:0 3px 8px #001b3d;
 width:95%;animation:captionIn 2s ease both;
}
@keyframes captionIn{from{opacity:0;transform:translate(-50%,25px)}to{opacity:1;transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage">
 <img class="poster" src="poster-pjok.png" alt="Ilustrasi anak-anak berolahraga">
 <div class="vignette"></div>
 <div class="logo-wrap" aria-label="Logo sekolah">
  <div class="logo-bg"></div>
  <img class="logo"
   src="https://drive.google.com/uc?export=view&id=1JJZOlp4j-nmjFsc2-OB-zr_wUAjMMocx"
   alt="Logo dari Google Drive"
   onerror="this.style.display='none';document.getElementById('logoError').style.display='block'">
  <span id="logoError" style="display:none;position:relative;z-index:2;color:#16345b;font-size:11px;text-align:center;padding:8px">Logo tidak termuat.<br>Unduh logo dari Drive dan gunakan file logo.png.</span>
 </div>
 <div class="sparkles"><span class="spark">✦</span><span class="spark">★</span><span class="spark">✧</span><span class="spark">✦</span></div>
 <div class="caption">PEMBELAJARAN PENDIDIKAN JASMANI, OLAHRAGA DAN KESEHATAN</div>
</div>
</body>
</html>
